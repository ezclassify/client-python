[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ezclassify-rest-client"
version = "1.0.0.dev30"
description = "HTTP client for the EzClassify REST API, delegating all operations over HTTP"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "EzClassify, LLC", email = "support@ezclassify.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    "httpcore>=1.0.9,<2",
    "httpx>=0.28.1,<1",
    "ezclassify-rest-contract>=1.0.0.dev30",
]

[project.urls]
Homepage = "https://github.com/ezclassify/client-python"
Source = "https://github.com/ezclassify/client-python"
Issues = "https://github.com/ezclassify/client-python/issues"

[project.optional-dependencies]
# PyYAML is not a runtime dependency of this package. The request-schema
# conformance tests in tests/ parse the vendored openapi.yaml to prove every
# request this client sends is one the wire contract declares; without a
# parser they fail at import rather than passing unchecked.
dev = ["pytest>=9.1", "pytest-cov>=7.1", "respx>=0.23.1", "PyYAML>=6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["ezclassify_rest_client"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/ezclassify_rest_client",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ezclassify_rest_client --cov-report=term-missing"
