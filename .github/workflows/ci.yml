name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, not nightly: push + PR runs are the primary gate; the schedule
    # exists only so the regen-and-diff steps below catch vendored-spec or
    # generator drift between pushes.
    - cron: '0 6 * * 0'   # Sunday 06:00 UTC; only fires on the repo's default branch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint plus spec/generator integrity (regen-and-diff) on a single runner.
  checks:
    if: ${{ github.event_name != 'schedule' || github.repository_owner == 'ezclassify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Lint and check formatting (ruff)
        run: make lint

      # Static typing gate for the py.typed packages: the published
      # annotations are checked in --strict mode (config in the root
      # pyproject.toml [tool.mypy] table) so a PEP 561 consumer running mypy
      # never sees errors our own CI did not.
      - name: Static type check (mypy --strict)
        run: |
          pip install --quiet mypy==2.4.0 ./types ./client
          mypy

      # Verifies that the shipped production models match the vendored
      # OpenAPI/JSON Schema contracts. The helper module is handwritten;
      # declarations are not duplicated there.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Read MANIFEST
        id: manifest
        run: |
          python3 -c "
          import json, os
          m = json.load(open('vendor/spec/MANIFEST.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('spec_sha256=' + m['openapiSha256'] + '\n')
              f.write('gen_sha256=' + m['generators']['python']['sha256'] + '\n')
          "

      - name: Verify spec hash
        run: |
          ACTUAL=$(sha256sum vendor/spec/openapi.yaml | awk '{print $1}')
          if [ "${{ steps.manifest.outputs.spec_sha256 }}" != "$ACTUAL" ]; then
            echo "ERROR: vendor/spec/openapi.yaml SHA mismatch"
            echo "  MANIFEST: ${{ steps.manifest.outputs.spec_sha256 }}"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Verify generator script hash
        run: |
          EXPECTED="${{ steps.manifest.outputs.gen_sha256 }}"
          ACTUAL=$(sha256sum scripts/gen.mjs | awk '{print $1}')
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "ERROR: scripts/gen.mjs hash mismatch. The generator may have been modified without updating MANIFEST"
            echo "  MANIFEST: $EXPECTED"
            echo "  actual:   $ACTUAL"
            exit 1
          fi

      - name: Regenerate shipped models from vendored contracts
        run: make regen

      - name: Check for unexpected changes
        run: |
          if ! git diff --exit-code -- types/ezclassify_rest_contract/models.py; then
            echo ""
            echo "ERROR: Shipped generated models differ from the vendored contracts."
            echo "Run 'make regen' locally and commit models.py."
            exit 1
          fi

      # The public API of the published packages (ezclassify-rest-contract,
      # -client) is frozen at 1.0. This diffs the live source
      # surface against the reviewed api-surface.txt and fails on any drift.
      # Stdlib-only ast walk, so no build or install is needed. Deliberate API
      # changes regenerate the golden with 'make api-surface' and commit it.
      - name: Check 1.0 public API surface
        run: python3 scripts/check_api_surface.py --check

      # License compliance over the real production closure: the two
      # published packages installed non-editable into a clean venv, then
      # checked by pip-licenses (CI-only tool, pinned) against a permissive
      # allowlist. certifi (MPL-2.0, transitive of httpx) is the single
      # reviewed exception and is gated separately so the main allowlist
      # stays permissive-only; rationale in THIRD-PARTY-NOTICES.md.
      - name: Dependency license compliance
        run: |
          # These exact wheels supply both the licensed production environment
          # and the final offline SBOM environment; do not rebuild the handoff.
          snapshot="$RUNNER_TEMP/python-dependencies"
          mkdir -p "$snapshot/wheels"
          pip wheel --no-deps --wheel-dir "$snapshot/wheels" ./types ./client
          python -m venv "$RUNNER_TEMP/prod-closure"
          "$RUNNER_TEMP/prod-closure/bin/pip" install --quiet "$snapshot"/wheels/*.whl
          pip install --quiet pip-licenses==5.5.5
          pip-licenses --python "$RUNNER_TEMP/prod-closure/bin/python" --from=mixed \
            --ignore-packages certifi \
            --allow-only "MIT;MIT License;BSD;BSD License;BSD-2-Clause;BSD-3-Clause;ISC;ISC License (ISCL);Apache-2.0;Apache Software License;PSF-2.0;Python Software Foundation License"
          pip-licenses --python "$RUNNER_TEMP/prod-closure/bin/python" --from=mixed \
            --packages certifi \
            --allow-only "MPL-2.0;Mozilla Public License 2.0 (MPL 2.0)"

      # THIRD-PARTY-NOTICES.md is generated from the packages' declared
      # runtime dependencies; regenerate and diff so it cannot go stale.
      - name: Third-party notices are current
        run: |
          "$RUNNER_TEMP/prod-closure/bin/python" scripts/gen-notices.py
          git diff --exit-code THIRD-PARTY-NOTICES.md

      # Preserve ordinary dependency inputs, not an early SBOM. The final job
      # rebuilds the same production environment offline after both test legs.
      - name: Freeze the licensed production closure
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/python-dependencies"
          mkdir -p "$snapshot/wheels"
          git rev-parse HEAD > "$snapshot/source-sha"
          python -c 'import platform; print(platform.python_version())' > "$snapshot/python-version"
          "$RUNNER_TEMP/prod-closure/bin/pip" list --format=freeze > "$snapshot/requirements.txt"
          "$RUNNER_TEMP/prod-closure/bin/pip" list --format=json > "$snapshot/installed.json"
          sed -E '/^ezclassify-rest-(client|contract)==/Id' "$snapshot/requirements.txt" > "$snapshot/third-party.txt"
          pip download --only-binary=:all: --no-deps --dest "$snapshot/wheels" -r "$snapshot/third-party.txt"
          "$RUNNER_TEMP/prod-closure/bin/python" scripts/check_frozen_wheels.py "$snapshot/wheels"
          (cd "$snapshot" && sha256sum requirements.txt installed.json wheels/* > SHA256SUMS)
          git diff --exit-code && test -z "$(git status --porcelain)"

      - name: Retain frozen production dependency inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-production-dependencies
          path: ${{ runner.temp }}/python-dependencies
          retention-days: 1
          if-no-files-found: error

  build:
    if: ${{ github.event_name != 'schedule' || github.repository_owner == 'ezclassify' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        python-version: ["3.11", "3.14"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build and test ezclassify-rest-contract
        working-directory: types
        run: |
          pip install -e ".[dev]"
          pytest

      - name: Build and test ezclassify-rest-client
        working-directory: client
        run: |
          pip install -e ".[dev]"
          pytest

      # Examples gate: the llm-classify demo's suite runs registry-free
      # (stdlib mocks, local editable installs). Its MCP-subprocess live tests
      # are a separate lane, `make test-mcp-live`, which needs a licensed MCP
      # runtime at MCP_SERVER_PATH.
      - name: Test llm-classify example
        working-directory: examples/llm-classify
        run: pytest tests/

      - name: Conformance suite (repo-root test harness)
        run: |
          pip install -e ".[dev]"
          pytest tests/

      # Pydantic floor. Assertion keeps decoding open and keyword construction
      # strict through a Pydantic 2 init marker, and the steps above run the
      # latest Pydantic only. Re-run the tests that pin that split on the
      # oldest release the package declares, on the oldest Python, last so no
      # earlier step runs on the downgraded install.
      - name: Construction and decoding split on the Pydantic floor
        if: matrix.python-version == '3.11'
        working-directory: types
        run: |
          pip install "pydantic==2.14.1"
          pytest --no-cov tests/test_wire_fidelity.py -k "ConstructionClosed or UnknownResponse or UnknownRequest"

      - name: Working tree is clean after build
        run: git diff --exit-code && test -z "$(git status --porcelain)"

  qualified-sbom:
    needs: [checks, build]
    if: ${{ always() && !cancelled() && (github.event_name != 'schedule' || github.repository_owner == 'ezclassify') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require all candidate validation
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TEST_RESULT: ${{ needs.build.result }}
        run: test "$CHECKS_RESULT" = success && test "$TEST_RESULT" = success

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-production-dependencies
          path: ${{ runner.temp }}/python-dependencies

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ${{ runner.temp }}/python-dependencies/python-version

      - name: Restore the exact production inventory offline
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/python-dependencies"
          test "$(cat "$snapshot/source-sha")" = "$(git rev-parse HEAD)"
          (cd "$snapshot" && sha256sum --check SHA256SUMS)
          python -m venv "$RUNNER_TEMP/prod-closure"
          "$RUNNER_TEMP/prod-closure/bin/pip" install --no-index --no-deps --find-links "$snapshot/wheels" -r "$snapshot/requirements.txt"
          "$RUNNER_TEMP/prod-closure/bin/pip" list --format=json > "$RUNNER_TEMP/restored-inventory.json"
          python - "$snapshot/installed.json" "$RUNNER_TEMP/restored-inventory.json" <<'PY'
          import json, re, sys
          def inventory(path):
              with open(path) as source:
                  return {re.sub(r"[-_.]+", "-", p["name"]).lower(): p["version"] for p in json.load(source)}
          if inventory(sys.argv[1]) != inventory(sys.argv[2]):
              raise SystemExit("Restored production inventory differs from the licensed candidate")
          PY

      - name: Generate qualified SBOM from the validated production closure
        run: |
          pip install --quiet cyclonedx-bom==7.5.0
          mkdir -p dist
          cyclonedx-py environment "$RUNNER_TEMP/prod-closure/bin/python" -o dist/sbom.json

      - name: Upload qualified SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: dist/sbom.json
          if-no-files-found: error
