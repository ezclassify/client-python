[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "ezclassify-rest-contract"
version = "1.0.0.dev30"
description = "Pydantic wire and domain contracts for the EzClassify REST API"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    { name = "EzClassify, LLC", email = "support@ezclassify.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # Capped below 3: Assertion keeps decoding open and construction strict
    # through a Pydantic 2 init marker (see _model_helpers._ClosedOnConstruction),
    # and CI pins both ends of the supported range.
    "pydantic>=2.14.1,<3",
    "typing-extensions>=4.15",
]

[project.urls]
Homepage = "https://github.com/ezclassify/client-python"
Source = "https://github.com/ezclassify/client-python"
Issues = "https://github.com/ezclassify/client-python/issues"

[project.optional-dependencies]
# PyYAML is not a runtime dependency of this package. The generation-boundary
# tests load scripts/gen_models.py, which parses the vendored openapi.yaml, so
# they need a YAML parser to check the boundary.
dev = ["pytest>=9.1", "pytest-cov>=7.1", "PyYAML>=6.0.3"]

[tool.hatch.build.targets.wheel]
packages = ["ezclassify_rest_contract"]

[tool.hatch.build.targets.sdist]
include = [
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/ezclassify_rest_contract",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=ezclassify_rest_contract --cov-report=term-missing"
